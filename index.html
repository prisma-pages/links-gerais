<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Operacionais</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <header class="header glass-card">
        <h1>Links Operacionais</h1>
        <p class="blink-warning">
            <i data-lucide="triangle-alert"></i> Atenção: Alguns links só estão disponíveis para uso interno.
        </p>
    </header>

    <main class="main-container">

        <div class="glass-category-card category-patio">
            <h2 class="category-header">
                <i data-lucide="train-front"></i> Pátios
            </h2>
            <div class="button-grid" id="grid-patio"></div>
        </div>

        <div class="glass-category-card category-gerais">
            <h2 class="category-header">
                <i data-lucide="link"></i> Gerais
            </h2>
            <div class="button-grid" id="grid-gerais"></div>
        </div>

        <div class="glass-category-card category-registros">
            <h2 class="category-header">
                <i data-lucide="clipboard-list"></i> Registros
            </h2>
            <div class="button-grid" id="grid-registros"></div>
        </div>

        <div class="glass-category-card category-treinamentos">
            <h2 class="category-header">
                <i data-lucide="graduation-cap"></i> Treinamentos
            </h2>
            <div class="button-grid" id="grid-treinamentos"></div>
        </div>

    </main>

    <div id="toast" class="toast glass-card">
        <i data-lucide="check-circle-2"></i> Link copiado com sucesso!
    </div>

    <footer class="footer glass-card">
        <p>2026 - © Marlon Fernandes & Nathara Ribeiro</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
