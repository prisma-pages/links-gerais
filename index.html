<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Operacionais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header class="header">
        <h1>Links Operacionais</h1>
        <p class="blink-warning"><i class="fa-solid fa-triangle-exclamation"></i> Atenção: Alguns links só estão
            disponíveis para uso interno.</p>
    </header>

    <main class="main-container">

        <section class="category-section category-patio">
            <h2><i class="fa-solid fa-train"></i> Pátios</h2>
            <div class="button-grid" id="grid-patio"></div>
        </section>

        <section class="category-section category-gerais">
            <h2><i class="fa-solid fa-link"></i> Gerais</h2>
            <div class="button-grid" id="grid-gerais"></div>
        </section>

        <section class="category-section category-registros">
            <h2><i class="fa-solid fa-clipboard-list"></i> Registros</h2>
            <div class="button-grid" id="grid-registros"></div>
        </section>

        <section class="category-section category-treinamentos">
            <h2><i class="fa-solid fa-graduation-cap"></i> Treinamentos</h2>
            <div class="button-grid" id="grid-treinamentos"></div>
        </section>

    </main>

    <div id="toast" class="toast">
        <i class="fa-solid fa-check-circle"></i> Link copiado com sucesso!
    </div>

    <footer class="footer">
        <p>2026 - © Marlon Fernandes & Nathara Ribeiro</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
